# ——————————————————————————————————————————————————————————————
#  Doomsday Nukes — Gradle / dependency pinning
#  Target: Minecraft 1.21.1, Java 21, Fabric Loader + Fabric Loom
# ——————————————————————————————————————————————————————————————

org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ── Game / toolchain ───────────────────────────────────────────
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9
# Fabric Loom: the 1.7 line targets MC 1.21.x with yarn + mojmap. A floating -SNAPSHOT is deliberate
# (the template pins it the same way): the 1.7 branch keeps fixing remap bugs against the exact
# loader/mapping versions used here, and the build is reproducible via the Gradle cache rather than
# via this string.
loom_version=1.7-SNAPSHOT

# ── Mod metadata (also injected into fabric.mod.json) ──────────
mod_version=1.0.0
maven_group=com.doomsday
archives_base_name=doomsday-nukes
mod_id=doomsday
mod_name=Doomsday Nukes

# ── Required runtime dependencies ──────────────────────────────
fabric_version=0.116.0+1.21.1

# ── Optional / compile-time-only integration targets ───────────
# These are deliberately NOT runtime dependencies. The mod detects them
# at runtime (FabricLoader.getInstance().isModLoaded) and degrades
# gracefully when they are absent. See docs in README.md §"Compatibility".
modmenu_version=11.0.2
