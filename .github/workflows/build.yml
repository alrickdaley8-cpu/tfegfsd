name: build

# Why this workflow is load-bearing rather than decorative:
#
# The mod targets Minecraft 1.21.1 with yarn mappings, and every vanilla symbol in it was written
# against that mapping set from documentation rather than from an IDE. The only thing that settles
# whether the result compiles is javac with the remapped jar on the classpath, which needs the
# Fabric maven, Mojang's content servers and a JDK 21. So this file is the build. `./gradlew build`
# on a workstation does the identical thing.
#
# Diagnostics are re-emitted as ::error:: annotations on purpose. Gradle and javac output is only
# reachable through the run log, which is a downloadable artefact; annotations are part of the check
# run itself, so a failure is legible from `gh api .../annotations`, from the PR UI, and from the
# commit status without opening the browser.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Loom decompiles and remaps the client jar; its caches are what make the second run on a
      # branch two minutes instead of six. Keyed on the pin files, because changing any of them
      # changes which artifacts must be re-fetched.
      - name: Cache Gradle and Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'settings.gradle', 'build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate resources and layout
        shell: bash
        run: |
          set +e
          set +o pipefail
          fail=0
          run_check() {
            name="$1"; shift
            code=0
            out="$("$@" 2>&1)" || code=$?
            if [ "$code" -ne 0 ]; then
              fail=1
              printf '%s\n' "$out" | grep -E "^(ERROR|.*: error:|.*error:)" | head -60 \
                | bash tools/annotate.sh "$name"
              # The summary line is the count the tool itself reports; without it a run that printed
              # "35 error(s)" and showed 4 of them teaches the reader nothing.
              printf '%s\n' "$out" | grep -E "error\(s\)|errors," | head -2 \
                | bash tools/annotate.sh "$name-summary"
            else
              printf '%s\n' "$out" | tail -3
            fi
          }
          run_check asset-validator java -ea tools/AssetValidator.java src/main/resources
          run_check selfcheck python3 tools/selfcheck.py
          run_check balance python3 tools/balance_check.py
          exit "$fail"

      - name: Build, test and remap
        shell: bash
        run: |
          set +e
          set +o pipefail
          ./gradlew --no-daemon --stacktrace build > /tmp/build.log 2>&1
          status=$?
          cat /tmp/build.log
          if [ "$status" -ne 0 ]; then
            {
              echo "== javac =="
              grep -E "error:|\[remap|unmapped" /tmp/build.log | head -30
              echo "== gradle =="
              grep -A 6 "What went wrong" /tmp/build.log | head -24
              grep -E "^\* (What went wrong|Where)|Caused by:|Task .* FAILED" /tmp/build.log | head -16
              echo "== tail =="
              tail -12 /tmp/build.log
            } > /tmp/diag.log
            bash tools/annotate.sh build < /tmp/diag.log
          fi
          exit "$status"

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: doomsday-nukes-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Report jar contents
        if: success()
        run: |
          jar=$(ls build/libs/doomsday-nukes-*.jar | grep -v sources | head -1)
          {
            echo "### Built \`$(basename "$jar")\` ($(du -h "$jar" | cut -f1))"
            echo '```'
            python3 - "$jar" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = set(z.namelist())
          print(f"{len(names)} entries")
          for want in ("fabric.mod.json", "doomsday.client.mixins.json",
                       "assets/doomsday/lang/en_us.json", "assets/doomsday/lang/de_de.json",
                       "assets/doomsday/sounds.json",
                       "assets/doomsday/blockstates/nuke_standard.json",
                       "data/doomsday/recipe/nuke_standard.json",
                       "data/doomsday/loot_table/blocks/vitrified_sand.json",
                       "assets/doomsday/shaders/post/doomsday_flash.json",
                       "assets/doomsday/textures/entity/glow.png",
                       "com/doomsday/nukes/DoomsdayNukes.class",
                       "com/doomsday/nukes/client/DoomsdayNukesClient.class",
                       "com/doomsday/nukes/mixin/GameRendererMixin.class"):
              print(("  ok    " if want in names else "  MISS  ") + want)
          PY
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
